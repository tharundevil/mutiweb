apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-app-deployment
  labels:
    app: my-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-app
  template:
    metadata: 
      labels:
        app: my-app
    spec:
      containers:
      - name: my-site
        image: docker.io/tharunvm10/myportfolio:latest
        ports:
        - containerPort: 80
          name: http
        volumeMounts:
        - name: nginx-metrics-config-volume
          mountPath: /etc/nginx/conf.d/metrics.conf
          subPath: metrics.conf
      - name: exporter
        image: nginx/nginx-prometheus-exporter:latest
        imagePullPolicy: IfNotPresent
        args:
        - --nginx.scrape-uri=http://127.0.0.1:8081/stub_status
        ports:
        - containerPort: 9113
          name: metrics
      volumes:
      - name: nginx-metrics-config-volume
        configMap:
          name: nginx-metrics-config
